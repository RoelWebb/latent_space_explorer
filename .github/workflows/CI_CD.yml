name: CI/CD

on:
    push:
        branches: [ "main" ]

permissions:
    contents: read


jobs:
    build:

        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

        steps:
            - name: Checkout repository and DeepSDF submodule
              uses: actions/checkout@v4
              with:
                submodules: recursive
            
            - name: Install uv, set the Python ${{ matrix.python-version }} and enable caching
              uses: astral-sh/setup-uv@v7
              with:
                python-version: ${{ matrix.python-version }}
                enable-cache: true
            
            - name: Set up Python and install dependencies
              run: uv sync --all-extras

            - name: Lint with flake8
              run: |
                # stop the build if there are Python syntax errors or undefined names
                uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
                uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

            # TODO add test files for pytest
            - name: Run tests
              run: |
                uv run python install_data_files.py
                echo "TODO implement tests for pytest"
                # uv run pytest
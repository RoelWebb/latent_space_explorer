[project]
name = "latent_space_explorer"
description = "UI application for exploring a latent space learned by DeepSDF, by interactively generating 3D shapes from weighted latent codes"
version = "0.0.1"
authors = [{name = "Roel Webb"}]

requires-python = ">=3.10, <3.11"

dependencies = [
  "numpy >= 1.25.2, <2.0.0",
  
  "pyqt5 >= 5.15.10",
  "matplotlib >= 3.7.1",
  "moderngl >= 5.8.2",
  
  "trimesh >= 3.23.5",
  "scipy >= 1.10.1",

  "torch-pca >= 1.1.0",
  "mdscuda >= 0.1.3",

  "pyrr >= 0.10.3",

  # DeepSDF mesh generation dependency
  "plyfile >= 1.0.1",
  "scikit-image >= 0.25.2"
]

license = "MIT"
license-files = ["LICENSE"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
repository = "https://github.com/RoelWebb/latent_space_explorer"
